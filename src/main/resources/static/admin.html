<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - دیوار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 min-h-screen" x-data="adminPanel()" x-init="init()">

    <!-- Header -->
    <header class="bg-gradient-to-r from-gray-800 to-gray-900 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <h1 class="text-xl font-bold">پنل مدیریت استخراج</h1>
            </div>
            <a href="/index.html" class="text-sm bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                صفحه جستجو
            </a>
        </div>
    </header>

    <div class="container mx-auto px-4 py-6">

        <!-- Status Bar -->
        <div x-show="scrapeStatus" x-transition class="mb-6 p-4 rounded-xl flex items-center gap-3"
             :class="{
                'bg-blue-50 border border-blue-200 text-blue-800': scrapeStatus === 'running',
                'bg-green-50 border border-green-200 text-green-800': scrapeStatus === 'done',
                'bg-red-50 border border-red-200 text-red-800': scrapeStatus === 'error'
             }">
            <svg x-show="scrapeStatus === 'running'" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span x-text="scrapeMessage"></span>
        </div>

        <!-- Scrape URLs Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-gray-800">لینک‌های استخراج</h2>
                <div class="flex items-center gap-3">
                    <button @click="selectAll()" class="text-sm text-blue-600 hover:text-blue-800">
                        انتخاب همه
                    </button>
                    <button @click="deselectAll()" class="text-sm text-gray-500 hover:text-gray-700">
                        لغو انتخاب
                    </button>
                </div>
            </div>

            <!-- Loading -->
            <div x-show="loadingUrls" class="text-center py-8">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-r-transparent"></div>
            </div>

            <!-- URL List -->
            <div x-show="!loadingUrls" class="space-y-3">
                <template x-for="url in urls" :key="url.id">
                    <div class="flex items-center gap-4 p-4 rounded-lg border transition"
                         :class="{
                            'border-blue-300 bg-blue-50': selectedIds.includes(url.id),
                            'border-gray-200 hover:border-gray-300': !selectedIds.includes(url.id)
                         }">
                        <!-- Checkbox -->
                        <input type="checkbox" :value="url.id"
                               :checked="selectedIds.includes(url.id)"
                               @change="toggleSelect(url.id)"
                               class="w-5 h-5 text-blue-600 rounded cursor-pointer">

                        <!-- URL Info -->
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold text-gray-900" x-text="url.persianTitle || url.url"></div>
                            <div class="flex items-center gap-3 mt-1">
                                <span class="text-xs px-2 py-0.5 rounded-full"
                                      :class="url.enabled ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'"
                                      x-text="url.enabled ? 'فعال' : 'غیرفعال'"></span>
                                <span class="text-xs text-gray-400" x-text="'ID: ' + url.id"></span>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="flex items-center gap-2">
                            <button @click="toggleUrl(url.id)"
                                    class="p-2 rounded-lg transition"
                                    :class="url.enabled ? 'text-green-600 hover:bg-green-50' : 'text-gray-400 hover:bg-gray-100'"
                                    :title="url.enabled ? 'غیرفعال کردن' : 'فعال کردن'">
                                <svg x-show="url.enabled" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                <svg x-show="!url.enabled" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                            </button>
                            <button @click="deleteUrl(url.id)"
                                    class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition"
                                    title="حذف">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <div x-show="urls.length === 0" class="text-center py-8 text-gray-400">
                    <p>لینکی وجود ندارد</p>
                </div>
            </div>

            <!-- Add New URL -->
            <div class="mt-4 pt-4 border-t space-y-3">
                <div class="flex gap-3">
                    <input type="text" x-model="newUrlTitle"
                           class="w-48 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="عنوان فارسی..."
                           @keyup.enter="addUrl()">
                    <input type="text" x-model="newUrl"
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="لینک جدید دیوار..."
                           @keyup.enter="addUrl()">
                    <button @click="addUrl()" :disabled="!newUrl.trim()"
                            class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg disabled:opacity-50 transition">
                        افزودن
                    </button>
                </div>
            </div>
        </div>

        <!-- Scrape Button -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-gray-800">استخراج دستی</h3>
                    <p class="text-sm text-gray-500 mt-1">
                        <span x-text="selectedIds.length"></span> لینک انتخاب شده
                    </p>
                </div>
                <button @click="runScrape()" :disabled="selectedIds.length === 0 || scraping"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed transition font-medium">
                    <svg x-show="scraping" class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <span x-text="scraping ? 'در حال استخراج...' : 'شروع استخراج'"></span>
                </button>
            </div>
        </div>

        <!-- Results -->
        <div x-show="scrapeResults" x-transition class="bg-white rounded-xl shadow-md p-6">
            <h3 class="font-bold text-gray-800 mb-4">نتیجه استخراج</h3>

            <!-- Summary -->
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-blue-50 rounded-lg p-4 text-center">
                    <div class="text-2xl font-bold text-blue-600" x-text="scrapeResults?.totalListings || 0"></div>
                    <div class="text-sm text-blue-500">آگهی یافت شده</div>
                </div>
                <div class="bg-green-50 rounded-lg p-4 text-center">
                    <div class="text-2xl font-bold text-green-600" x-text="scrapeResults?.totalSent || 0"></div>
                    <div class="text-sm text-green-500">ارسال شده به تلگرام</div>
                </div>
            </div>

            <!-- Per-URL Results -->
            <div class="space-y-3">
                <template x-for="r in (scrapeResults?.results || [])" :key="r.urlId">
                    <div class="flex items-center gap-3 p-3 rounded-lg"
                         :class="r.status === 'success' ? 'bg-green-50' : 'bg-red-50'">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center"
                             :class="r.status === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'">
                            <svg x-show="r.status === 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            <svg x-show="r.status !== 'success'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-medium truncate" x-text="r.persianTitle"></div>
                            <div class="text-xs text-gray-500" x-show="r.status === 'success'"
                                 x-text="'یافت شده: ' + r.listingsFound + ' | ارسال شده: ' + r.listingsSent"></div>
                            <div class="text-xs text-red-500" x-show="r.status !== 'success'"
                                 x-text="r.error || 'خطا'"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-transition
         class="fixed bottom-4 left-4 z-50 px-6 py-3 rounded-lg shadow-lg text-white"
         :class="{'bg-green-600': toast.type === 'success', 'bg-red-600': toast.type === 'error'}">
        <span x-text="toast.message"></span>
    </div>

    <script>
        function adminPanel() {
            return {
                urls: [],
                selectedIds: [],
                loadingUrls: false,
                scraping: false,
                scrapeStatus: null,
                scrapeMessage: '',
                scrapeResults: null,
                newUrl: '',
                newUrlTitle: '',
                toast: { show: false, message: '', type: 'success' },

                async init() {
                    await this.loadUrls();
                },

                async loadUrls() {
                    this.loadingUrls = true;
                    try {
                        const res = await fetch('/api/urls');
                        this.urls = await res.json();
                    } catch (e) {
                        this.showToast('خطا در بارگذاری لینک‌ها', 'error');
                    } finally {
                        this.loadingUrls = false;
                    }
                },

                toggleSelect(id) {
                    const idx = this.selectedIds.indexOf(id);
                    if (idx === -1) this.selectedIds.push(id);
                    else this.selectedIds.splice(idx, 1);
                },

                selectAll() {
                    this.selectedIds = this.urls.filter(u => u.enabled).map(u => u.id);
                },

                deselectAll() {
                    this.selectedIds = [];
                },

                async addUrl() {
                    if (!this.newUrl.trim()) return;
                    try {
                        const res = await fetch('/api/urls', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: this.newUrl.trim(), persianTitle: this.newUrlTitle.trim() })
                        });
                        if (res.ok) {
                            this.newUrl = '';
                            this.newUrlTitle = '';
                            this.showToast('لینک اضافه شد', 'success');
                            await this.loadUrls();
                        } else {
                            const data = await res.json();
                            this.showToast(data.error || 'خطا', 'error');
                        }
                    } catch (e) {
                        this.showToast('خطا در افزودن لینک', 'error');
                    }
                },

                async toggleUrl(id) {
                    try {
                        await fetch(`/api/urls/${id}/toggle`, { method: 'PUT' });
                        await this.loadUrls();
                    } catch (e) {
                        this.showToast('خطا', 'error');
                    }
                },

                async deleteUrl(id) {
                    if (!confirm('آیا از حذف مطمئن هستید؟')) return;
                    try {
                        await fetch(`/api/urls/${id}`, { method: 'DELETE' });
                        this.selectedIds = this.selectedIds.filter(x => x !== id);
                        this.showToast('حذف شد', 'success');
                        await this.loadUrls();
                    } catch (e) {
                        this.showToast('خطا', 'error');
                    }
                },

                async runScrape() {
                    if (this.selectedIds.length === 0) return;
                    this.scraping = true;
                    this.scrapeStatus = 'running';
                    this.scrapeMessage = 'در حال استخراج... لطفاً صبر کنید';
                    this.scrapeResults = null;

                    try {
                        const res = await fetch('/api/scrape/selected', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ urlIds: this.selectedIds })
                        });
                        this.scrapeResults = await res.json();
                        this.scrapeStatus = 'done';
                        this.scrapeMessage = 'استخراج با موفقیت انجام شد';
                        this.showToast('استخراج تمام شد', 'success');
                    } catch (e) {
                        this.scrapeStatus = 'error';
                        this.scrapeMessage = 'خطا در استخراج';
                        this.showToast('خطا در استخراج', 'error');
                    } finally {
                        this.scraping = false;
                    }
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => { this.toast.show = false; }, 3000);
                }
            };
        }
    </script>
</body>
</html>
